[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vietformer"
version = "0.1.0"
description = "Mini-GPT (Transformer decoder-only) viết từ đầu bằng PyTorch để học, dùng dữ liệu tiếng Việt"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Cho phép `import vietformer` khi chạy pytest mà không cần cài đặt gói.
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]  # từ sentencepiece
